services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
      POSTGRES_DB: catalogo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
